<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Rename this. It is your app. -->
    <title>Your AI Application</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 44rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      #log {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 1rem;
        min-height: 20rem;
        margin-bottom: 1rem;
        white-space: pre-wrap;
        overflow-y: auto;
      }
      .turn { margin-bottom: 1rem; }
      .who { font-weight: 600; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.5rem; font: inherit; }
      button { padding: 0.5rem 1rem; font: inherit; }
    </style>
  </head>
  <body>
    <h1>Your AI Application</h1>
    <p>
      This is a deliberately plain frontend. Making it good is your job — open
      this file in VS Code and point Claude Code at it.
    </p>

    <div id="log"></div>
    <form id="form">
      <input id="input" placeholder="Ask something..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>

    <script type="module">
      // NOTE: this loads the Gradio client from a public CDN. On a locked-down
      // corporate network that request may simply fail. Worth noticing now --
      // it is the kind of thing that turns a working demo into a broken one the
      // moment it moves inside the firewall.
      import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

      const client = await Client.connect(window.location.origin);
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");

      // The model has no memory. This array is the entire conversation.
      const history = [];

      function addTurn(who, text) {
        const div = document.createElement("div");
        div.className = "turn";
        div.innerHTML = `<span class="who">${who}:</span> `;
        const span = document.createElement("span");
        div.appendChild(span);
        span.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        return span;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";

        addTurn("You", message);
        const out = addTurn("Assistant", "");

        // submit() streams; each event carries the reply so far.
        let reply = "";
        const job = client.submit("/chat", { message, history });
        for await (const event of job) {
          if (event.type === "data") {
            reply = event.data[0];
            out.textContent = reply;
            log.scrollTop = log.scrollHeight;
          }
        }

        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: reply });
      });
    </script>
  </body>
</html>
