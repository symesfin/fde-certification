[project]
name = "fde-curriculum"
version = "0.1.0"
description = "The AI Forward-Deployed Engineer Certification — 10-week curriculum"
requires-python = ">=3.12"

dependencies = [
    # Pinned EXACTLY, not a range. The .ipynb mirrors embed the marimo version in
    # their metadata, so a version bump rewrites every mirror in the repo. See
    # CLAUDE.md, "The marimo bump ritual".
    "marimo==0.23.16",
    "nbformat>=5.10",          # required by `marimo export ipynb`
    "python-dotenv>=1.2",      # helpers tier 1
    "litellm>=1.90",           # helpers tier 2
    "numpy>=2.0",              # from Week 3 on; the from-scratch retrieval math
    "pillow>=11.0",            # Week 3 S6 reads the charts and keyframes
    "pydantic>=2",             # Week 1's challenge app and Week 2 S4 import it directly;
                               # litellm brings it anyway, declared so a litellm change cannot remove it
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",      # scripts/check_manifests.py
    "nbclient>=0.10",   # scripts/check_execute.py -- runs the .ipynb mirrors
    "ipykernel>=6.29",
]

# Week 2 runs a real model on your own machine. Opt-in, because it is a few
# hundred MB and Weeks 1 and 3 do not need it:
#
#     uv sync --group local
local = [
    "torch>=2.6",
    "transformers>=5.0",
    "accelerate>=1.0",
    "sentence-transformers>=5.0",   # the no-API embedding fallback
]

# The bonus harness appendix builds the same agent three ways. Only the
# from-scratch one runs on the root environment; the two framework notebooks want
# the LangChain stack, which nothing else here uses. Opt-in, exactly like `local`:
#
#     uv sync --group harness
#
# Also listed in [tool.fde].sandbox-only below, so `marimo edit --sandbox` and
# `check_guarded.py` resolve them from each notebook's own PEP 723 block without
# the group. Both entries are needed and they are not redundant: the group is for
# the root environment, the allowlist is for the notebook.
harness = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-openai>=1.5",
    "deepagents>=0.7.6",
]

# One group per week whose notebooks need packages the root environment does not
# ship. The notebooks run under `--sandbox` without any of these (each resolves
# its own PEP 723 header); install a week's group when you open its notebooks
# from the root environment instead, or to run `make execute` on that week.
#
#     make setup-week W=3        # uv sync --group week3
#     make setup-all             # every optional group
#
# Pins are copied from the notebooks' headers, and scripts/mirrors.py fails CI
# if a notebook and its group disagree.
week3 = [
    "rank-bm25>=0.2.2",           # S5 -- the chunk index on the Agentic RAG side
    "pandas>=2.2",                # S5 -- the results table
    "mcp>=1.2",                   # S5 -- litellm imports it when tools= is passed
    "qdrant-client>=1.12",        # S6 -- the vector database, in-process
    "fastembed>=0.7",             # S6 -- CLIP and the local text model as ONNX, no torch
    "opencv-python-headless>=4.10",  # S6 -- keyframe sampling
    "llama-index-core>=0.14",     # S6 -- the one-step opener (MultiModalVectorStoreIndex)
]
week4 = [
    "ragas==0.4.3",               # S7 -- Faithfulness, behind a run button
    "langchain-community<0.4",    # ragas' own pin; unpinned, `import ragas` fails
]

# ---------------------------------------------------------------------------
# torch wheels: CPU by default, and that is a real choice, not a limitation.
#
# The CPU index ships wheels for Linux (x86_64, aarch64), Windows (amd64,
# arm64), and macOS arm64 — so one pin covers the whole cohort.
#
# **Apple Silicon keeps MPS.** The macOS wheel in this index is the same build
# PyPI serves; PyTorch does not publish a separate CPU-only Mac wheel. Nothing
# is given up by pinning here.
#
# Week 2's model is 350M parameters. It generates faster than you can read on
# any laptop CPU, so a GPU buys nothing this week. Week 8 (fine-tuning) is where
# that changes, and that is the right time to reach for one.
#
# HAVE AN NVIDIA GPU AND WANT IT NOW? Change the URL below to cu130 (or cu126)
# and re-run `uv sync --group local`. Both carry torch 2.13 for Linux *and*
# Windows. Avoid cu129: Linux only. Avoid cu128: stuck at torch 2.11.
#
# AMD: ROCm is Linux-only — there are zero official Windows ROCm wheels — and
# the newest ROCm index (rocm7.0) is pinned to torch 2.10, several versions
# behind everything else here. Workable, but it will not share this lockfile.
# Use a separate environment if you want it.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch" }]

[tool.fde]
# Tier-2 helpers whose consuming week has not been copied into this repository
# yet. `scripts/check_helpers.py` reports these as pending instead of failing,
# and FAILS if one of them gains a consumer, so the entry has to be removed the
# week it arrives. Keep this list empty in the repository every week ships from.
helpers-pending = [
    "adapter",      # fine-tuning
    "embeddings",   # dense retrieval -- the Week 3 bonus swap; no session imports it yet
    "guardrails",   # guardrails
    "judge",        # evals
    "llm",          # the packaged model call, referenced from retrieval onward
    "memory",       # memory
    "tools",        # agent architecture
    "trace",        # agent architecture
]

# Packages a notebook may declare in its PEP 723 block WITHOUT a matching entry in
# [project.dependencies] above. Everything else must match the root exactly, so two
# students on the same lesson get the same library versions.
#
# Add to this list only when a dependency is genuinely notebook-local — something
# too heavy or too platform-specific to put in every student's root env.
sandbox-only = [
    "torch",
    "transformers",
    "qdrant-client",
    "fastembed",
    "opencv-python-headless",
    "rank-bm25",
    "pandas",
    "mcp",
    "llama-index-core",
    "pydantic",
    # Ragas drags the LangChain stack in with it; see the week4 group for the pin.
    "ragas",
    "langchain-community",
    # The harness sessions build the same agent three ways. Only the from-scratch
    # one runs on the root environment; the two framework notebooks pull in the
    # whole LangChain stack plus a checkpointer, which nothing else here wants and
    # which would make every unrelated notebook slower to resolve.
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-openai",
    "deepagents",
]

[tool.uv]
package = false
