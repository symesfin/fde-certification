<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="592" rx="16"/>

<text class="title" x="32" y="40">Each iteration is a new deep agent that reads the notes but cannot write them</text>
<text class="subtitle" x="32" y="62">The agent writes /solution.py. Only the loop writes /AGENTS.md, from what the checker saw.</text>

<!-- ============ one iteration ============ -->
<rect class="zone" x="32" y="84" width="368" height="488" rx="14"/>
<text class="tiny t-accent" x="48" y="106" letter-spacing="1.5" font-weight="700">ONE ITERATION</text>
<text class="mono t-muted" x="384" y="106" text-anchor="end">deep_agent_attempt</text>

<rect class="node" x="48" y="118" width="336" height="164" rx="10"/>
<text class="tiny" x="64" y="138" letter-spacing="1.5" font-weight="700">A NEW AGENT, EVERY TIME</text>
<text class="mono" x="64" y="160">create_deep_agent(</text>
<text class="mono" x="80" y="178">model=MODEL, backend=files,</text>
<text class="mono t-accent" x="80" y="196">memory=[NOTES],</text>
<text class="tiny t-accent" x="368" y="196" text-anchor="end">NOTES = "/AGENTS.md"</text>
<text class="mono" x="80" y="214">system_prompt=CODER_PROMPT,</text>
<text class="mono t-warn" x="80" y="232">permissions=[FilesystemPermission(</text>
<text class="mono t-warn" x="96" y="250">operations=["write"], paths=[NOTES],</text>
<text class="mono t-warn" x="96" y="268">mode="deny")])</text>

<rect class="node" x="48" y="294" width="336" height="48" rx="10"/>
<text class="mono" x="64" y="314">files.delete("/solution.py")</text>
<text class="small" x="64" y="332">never re-check the last iteration's file</text>

<rect class="node-accent" x="48" y="354" width="336" height="68" rx="10"/>
<text class="mono" x="64" y="376">agent.stream(spec, …)</text>
<text class="mono t-muted" x="64" y="394">thread_id=uuid4()</text>
<text class="mono t-muted" x="64" y="412">recursion_limit=12</text>
<text class="small" x="368" y="394" text-anchor="end">no earlier messages</text>
<text class="small" x="368" y="412" text-anchor="end">about five tool rounds</text>

<rect class="node" x="48" y="434" width="336" height="60" rx="10"/>
<text class="mono" x="64" y="456">files.download_files(["/solution.py"])</text>
<text class="small" x="64" y="478">returns the code to the loop</text>

<text class="small" x="48" y="518">Out of steps? GraphRecursionError is caught,</text>
<text class="small" x="48" y="534">and whatever the agent wrote is still read.</text>
<text class="small" x="48" y="556">Every model call starts near 3,700 input tokens.</text>

<!-- ============ the store ============ -->
<text class="tiny" x="472" y="106" letter-spacing="1.5" font-weight="700">THE STORE</text>
<text class="mono t-muted" x="472" y="126">StoreBackend</text>

<rect class="node-accent" x="472" y="144" width="176" height="112" rx="10"/>
<text class="mono t-accent" x="488" y="168">/AGENTS.md</text>
<text class="small" x="488" y="186">the notes</text>
<rect class="chip-warn" x="488" y="198" width="144" height="22" rx="11"/>
<text class="tiny t-inv" x="560" y="213" text-anchor="middle" font-weight="700">agent: write denied</text>
<rect class="chip-muted" x="488" y="226" width="144" height="22" rx="11"/>
<text class="tiny t-inv" x="560" y="241" text-anchor="middle" font-weight="700">loop: writes</text>

<rect class="node" x="472" y="364" width="176" height="72" rx="10"/>
<text class="mono" x="488" y="392">/solution.py</text>
<text class="small" x="488" y="412">the agent's code</text>

<!-- memory= reads the notes into the agent -->
<line class="edge-accent" x1="472" y1="192" x2="388" y2="192" marker-end="url(#arrow-accent)"/>
<text class="tiny t-accent" x="436" y="182" text-anchor="middle" font-weight="700">loads</text>
<!-- the agent writes its code; the attempt reads it back -->
<line class="edge" x1="384" y1="388" x2="468" y2="388" marker-end="url(#arrow)"/>
<text class="tiny" x="436" y="378" text-anchor="middle" font-weight="700">write_file</text>
<path class="edge" d="M 472 424 L 428 424 L 428 452 L 388 452" marker-end="url(#arrow)"/>

<!-- ============ the loop ============ -->
<text class="tiny" x="712" y="106" letter-spacing="1.5" font-weight="700">THE LOOP</text>
<text class="mono t-muted" x="712" y="126">ralph_loop</text>

<rect class="node" x="712" y="172" width="180" height="48" rx="10"/>
<text class="mono" x="728" y="192">write_notes()</text>
<text class="small" x="728" y="210">what the checker saw</text>
<line class="edge" x1="712" y1="196" x2="652" y2="196" marker-end="url(#arrow)"/>
<text class="tiny" x="680" y="186" text-anchor="middle" font-weight="700">writes</text>

<rect class="node" x="712" y="458" width="180" height="48" rx="10"/>
<text class="mono" x="728" y="478">check_strict</text>
<text class="small" x="728" y="496">passed? stop here</text>

<line class="edge" x1="384" y1="482" x2="708" y2="482" marker-end="url(#arrow)"/>
<text class="tiny" x="560" y="472" text-anchor="middle" font-weight="700">code</text>
<path class="edge" d="M 892 482 L 912 482 L 912 196 L 896 196" marker-end="url(#arrow)"/>
<text class="tiny" x="906" y="340" text-anchor="end" font-weight="700">failed</text>
</svg>
