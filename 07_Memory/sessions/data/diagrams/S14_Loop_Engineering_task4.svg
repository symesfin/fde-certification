<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" role="img" aria-labelledby="title desc">
<title id="title">Each iteration is a new deep agent that reads the notes but cannot write them</title>
<desc id="desc">One iteration of the loop, with attempt_fn opened up as deep_agent_attempt. create_deep_agent builds a new agent every iteration with backend=files, memory=[NOTES] where NOTES is /AGENTS.md, and a FilesystemPermission that denies writes to it. The attempt deletes /solution.py, then streams the spec to the agent with a new thread_id and recursion_limit=12; a GraphRecursionError is caught, so the file is still read. memory= loads /AGENTS.md from the store into the agent's system prompt. The agent's write_file puts its code in /solution.py in the store, and the attempt downloads it and returns the code. ralph_loop runs the code through check_strict and, on a failure, writes the note to /AGENTS.md itself with write_notes.</desc>
