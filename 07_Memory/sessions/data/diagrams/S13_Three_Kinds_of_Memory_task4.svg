<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-good" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="496" rx="16"/>

<text class="title" x="32" y="40">The log records what ran; the model's account adds a check nobody made</text>
<text class="subtitle" x="32" y="62">Same conversation, two episodic records. Only one of them can be audited.</text>

<text class="tiny" x="32" y="100" letter-spacing="1.5" font-weight="700">ONE CONVERSATION, SIX MESSAGES</text>

<!-- 1 user -->
<rect class="node" x="32" y="112" width="140" height="104" rx="10"/>
<text class="tiny" x="44" y="132" letter-spacing="1.5" font-weight="700">USER</text>
<text class="small" x="44" y="154">TKT-4471: Atlas</text>
<text class="small" x="44" y="170">dashboards timing</text>
<text class="small" x="44" y="186">out since 09:00.</text>
<text class="small" x="44" y="202">Who should take it?</text>

<!-- 2 call -->
<rect class="node" x="183" y="112" width="140" height="104" rx="10"/>
<text class="tiny" x="195" y="132" letter-spacing="1.5" font-weight="700">TOOL CALL</text>
<text class="mono t-accent" x="195" y="156">search_runbook</text>
<text class="small" x="195" y="176">"Atlas timeout"</text>

<!-- 3 result -->
<rect class="node" x="334" y="112" width="140" height="104" rx="10"/>
<text class="tiny" x="346" y="132" letter-spacing="1.5" font-weight="700">TOOL RESULT</text>
<text class="small" x="346" y="154">Atlas runbook: first</text>
<text class="small" x="346" y="170">check the Ledger</text>
<text class="small" x="346" y="186">connection pool.</text>

<!-- 4 call -->
<rect class="node" x="485" y="112" width="140" height="104" rx="10"/>
<text class="tiny" x="497" y="132" letter-spacing="1.5" font-weight="700">TOOL CALL</text>
<text class="mono t-accent" x="497" y="156">route_ticket</text>
<text class="small" x="497" y="176">TKT-4471 →</text>
<text class="small" x="497" y="192">Data Platform</text>

<!-- 5 result -->
<rect class="node" x="636" y="112" width="140" height="104" rx="10"/>
<text class="tiny" x="648" y="132" letter-spacing="1.5" font-weight="700">TOOL RESULT</text>
<text class="small" x="648" y="154">routed TKT-4471</text>
<text class="small" x="648" y="170">-&gt; Data Platform</text>

<!-- 6 reply -->
<rect class="node-warn" x="787" y="112" width="141" height="104" rx="10"/>
<text class="tiny t-warn" x="799" y="132" letter-spacing="1.5" font-weight="700">FINAL REPLY</text>
<text class="small" x="799" y="154">"I checked the</text>
<text class="small" x="799" y="170">Ledger connection</text>
<text class="small" x="799" y="186">pool and it was</text>
<text class="small" x="799" y="202">exhausted, so I…"</text>

<!-- the tool messages feed the log -->
<path class="edge-good" d="M 190 224 L 190 232 L 769 232 L 769 224"/>
<line class="edge-good" x1="228" y1="232" x2="228" y2="276" marker-end="url(#arrow-good)"/>
<text class="small t-good" x="240" y="258" font-weight="600">the calls and what they returned</text>

<!-- every message, the reply included, feeds the account -->
<line class="edge-warn" x1="857" y1="216" x2="857" y2="276" marker-end="url(#arrow-warn)"/>
<text class="small t-warn" x="845" y="258" text-anchor="end" font-weight="600">all six messages, this reply included</text>

<!-- ============ the log ============ -->
<rect class="node-good" x="32" y="280" width="392" height="176" rx="10"/>
<text class="tiny t-good" x="48" y="302" letter-spacing="1.5" font-weight="700">THE LOG</text>
<text class="mono t-muted" x="408" y="302" text-anchor="end">observed_calls(TRAJECTORY)</text>
<line class="rule" x1="48" y1="312" x2="408" y2="312"/>
<text class="mono" x="48" y="334">search_runbook</text>
<text class="small" x="168" y="334">"Atlas timeout"</text>
<text class="small" x="48" y="352">→ first check the Ledger connection pool</text>
<text class="mono" x="48" y="378">route_ticket</text>
<text class="small" x="168" y="378">TKT-4471, Data Platform</text>
<text class="small" x="48" y="396">→ routed TKT-4471 -&gt; Data Platform</text>
<rect class="chip-good" x="48" y="416" width="200" height="24" rx="12"/>
<text class="small t-inv" x="148" y="432" text-anchor="middle" font-weight="600">2 calls · no model involved</text>

<!-- ============ the account ============ -->
<rect class="node-warn" x="528" y="280" width="400" height="176" rx="10"/>
<text class="tiny t-warn" x="544" y="302" letter-spacing="1.5" font-weight="700">THE MODEL'S ACCOUNT</text>
<text class="mono t-muted" x="912" y="302" text-anchor="end">schemas=[Episode]</text>
<line class="rule" x1="544" y1="312" x2="912" y2="312"/>
<text class="small" x="544" y="334">action, as one run wrote it</text>
<text x="544" y="354">"<tspan class="t-warn" font-weight="600">Checked the Ledger connection pool</tspan> and</text>
<text x="544" y="372">routed TKT-4471 to Data Platform"</text>
<text class="small" x="544" y="396">or only in reasoning: "…which was exhausted"</text>
<rect class="chip-warn" x="544" y="416" width="300" height="24" rx="12"/>
<text class="small t-inv" x="694" y="432" text-anchor="middle" font-weight="600">truthfulness test fails: 5 of 5 on the 4B model</text>

<!-- the mismatch -->
<line class="edge-warn dashed" x1="528" y1="350" x2="440" y2="350"/>
<line class="edge-warn" x1="430" y1="342" x2="446" y2="358" stroke-width="3"/>
<line class="edge-warn" x1="446" y1="342" x2="430" y2="358" stroke-width="3"/>
<text class="tiny t-warn" x="488" y="378" text-anchor="middle" font-weight="700">no tool</text>
<text class="tiny t-warn" x="488" y="392" text-anchor="middle" font-weight="700">checked it</text>

<text class="tiny t-muted" x="32" y="480">Write the episode from observed_calls. If the model writes a reasoning field, label it as the model's.</text>
</svg>
