<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" aria-labelledby="title desc">
<title id="title">The log records what ran; the model's account adds a check nobody made</title>
<desc id="desc">One conversation about TKT-4471 has six messages: the user's question, a search_runbook call, its result ("first check the Ledger connection pool"), a route_ticket call, its result (routed to Data Platform), and a final reply that says "I checked the Ledger connection pool and it was exhausted". The log, built by observed_calls from the tool calls and their results with no model, holds two calls, and neither checked the pool. The model's account, written by create_memory_manager with the Episode schema from all six messages, repeats the claimed check. The truthfulness test failed in five of five runs.</desc>
