  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="520" rx="16"/>

<text class="title" x="32" y="40">A procedure is learned once from the log, then tried first</text>
<text class="subtitle" x="32" y="62">solve() counts the saving, and it is bounded by how many wrong turns there were to skip.</text>

<!-- ============ the log ============ -->
<rect class="node" x="32" y="84" width="320" height="224" rx="10"/>
<text class="tiny" x="48" y="106" letter-spacing="1.5" font-weight="700">THE LOG, FIRST TIME</text>
<text class="small" x="48" y="124">find shipment SH-2231's current depot</text>

<!-- attempt 1 -->
<line class="edge-warn" x1="50" y1="142" x2="60" y2="152"/><line class="edge-warn" x1="60" y1="142" x2="50" y2="152"/>
<text class="label" x="72" y="152">read the Ledger record</text>
<text class="small" x="72" y="169">said Leeds; Ledger lags up to 20 min</text>
<!-- attempt 2 -->
<line class="edge-warn" x1="50" y1="184" x2="60" y2="194"/><line class="edge-warn" x1="60" y1="184" x2="50" y2="194"/>
<text class="label" x="72" y="194">search the wiki</text>
<text class="small" x="72" y="211">no answer</text>
<!-- attempt 3 -->
<line class="edge-warn" x1="50" y1="226" x2="60" y2="236"/><line class="edge-warn" x1="60" y1="226" x2="50" y2="236"/>
<text class="label" x="72" y="236">ask in #ops</text>
<text class="small" x="72" y="253">nobody replied for an hour</text>
<!-- attempt 4 -->
<path class="edge-good" d="M 49 273 L 53 278 L 61 267"/>
<text class="label" x="72" y="278">query Atlas /shipments/{id}</text>
<text class="small t-good" x="72" y="295" font-weight="600">depot = Wakefield</text>

<!-- ============ the manager ============ -->
<line class="edge" x1="352" y1="196" x2="380" y2="196" marker-end="url(#arrow)"/>
<rect class="node" x="384" y="152" width="192" height="88" rx="10"/>
<text class="mono" x="480" y="180" text-anchor="middle">create_memory_manager</text>
<text class="mono t-accent" x="480" y="202" text-anchor="middle">schemas=[Procedure]</text>
<text class="mono t-muted" x="480" y="224" text-anchor="middle">enable_updates=False</text>
<line class="edge" x1="576" y1="196" x2="604" y2="196" marker-end="url(#arrow)"/>
<text class="tiny" x="590" y="186" text-anchor="middle">put</text>

<!-- ============ the record ============ -->
<rect class="node-accent" x="608" y="84" width="320" height="224" rx="10"/>
<text class="mono t-muted" x="624" y="108">("procedures",)</text>
<text class="mono" x="624" y="128">key "find shipment depot"</text>
<line class="rule" x1="624" y1="142" x2="912" y2="142"/>
<text class="small" x="624" y="164">approach_that_worked</text>
<text class="mono t-accent" x="624" y="184">query Atlas /shipments/{id}</text>
<text class="small" x="624" y="212">avoid</text>
<text x="624" y="232">the Ledger record (lags), the wiki, #ops</text>
<text class="tiny t-muted" x="624" y="288">written by the model; wording varies run to run</text>

<!-- ============ solve ============ -->
<line class="edge-accent" x1="768" y1="308" x2="768" y2="344" marker-end="url(#arrow-accent)"/>
<text class="tiny" x="778" y="330">store.get(("procedures",), task)</text>
<rect class="node" x="608" y="348" width="320" height="120" rx="10"/>
<text class="mono" x="624" y="374">solve(store, task)</text>
<text class="small" x="624" y="400">1. get the procedure for this task</text>
<text class="small" x="624" y="420">2. try its approach first (word match; last mentioned wins ties)</text>
<text class="small" x="624" y="440">3. count attempts until one works</text>

<line class="edge" x1="608" y1="408" x2="564" y2="408" marker-end="url(#arrow)"/>
<text class="tiny" x="586" y="398" text-anchor="middle">counts</text>

<!-- ============ the counter ============ -->
<rect class="node" x="32" y="348" width="528" height="120" rx="10"/>
<text class="tiny" x="48" y="372" letter-spacing="1.5" font-weight="700">APPROACHES TRIED</text>
<text class="tiny" x="360" y="372" letter-spacing="1.5" font-weight="700" text-anchor="middle">EMPTY STORE</text>
<text class="tiny" x="480" y="372" letter-spacing="1.5" font-weight="700" text-anchor="middle">WITH PROCEDURES</text>
<line class="rule" x1="48" y1="382" x2="544" y2="382"/>

<text class="mono" x="48" y="404">find shipment depot</text>
<text x="360" y="404" text-anchor="middle">4 of 4</text>
<text class="label t-good" x="480" y="404" text-anchor="middle">1 of 4</text>

<text class="mono" x="48" y="428">expense filing</text>
<text x="360" y="428" text-anchor="middle">3 of 3</text>
<text class="label t-good" x="480" y="428" text-anchor="middle">1 of 3</text>

<text class="mono" x="48" y="452">reset a scanner</text>
<text class="small" x="196" y="452">no log to learn from</text>
<text x="360" y="452" text-anchor="middle">3 of 3</text>
<text x="480" y="452" text-anchor="middle">3 of 3</text>

<text class="tiny t-muted" x="32" y="492">Empty store: counted by solve(), no model involved. With procedures: the approach sharing most words with approach_that_worked; the last mentioned wins ties.</text>
</svg>
