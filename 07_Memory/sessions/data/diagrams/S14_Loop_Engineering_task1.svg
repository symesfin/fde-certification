<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" role="img" aria-labelledby="title desc">
<title id="title">Every acceptance criterion should map to a line of the checker</title>
<desc id="desc">The spec has three parts: the goal, a function normalise_ticket(raw: str) -> dict; four acceptance criteria; and three constraints. Each acceptance criterion points to the line of the first checker that tests it, over four cases: exactly the keys id, summary and urgency maps to the set comparison; the id pattern maps to comparing id with the expected value; never raises maps to the try and except around the call. The urgency criterion maps to a membership test, drawn dashed, because it checks that urgency is one of the three values rather than the right one. No line tests the constraints, or that malformed input returns summary=''.</desc>
<style>
  .bg{fill:#FBFAF7}
  .frame{fill:none;stroke:#E4E1DA;stroke-width:1}
  .node{fill:#FFFFFF;stroke:#CBD2DA;stroke-width:1.25}
  .node-soft{fill:#F2F1EC;stroke:none}
  .node-accent{fill:#EEF0FF;stroke:#4F46E5;stroke-width:1.75}
  .node-good{fill:#EAF7EE;stroke:#2F9E44;stroke-width:1.5}
  .node-warn{fill:#FFF1E8;stroke:#D9480F;stroke-width:1.5}
  .zone{fill:#F4F5FF;stroke:#4F46E5;stroke-width:1.5;stroke-dasharray:6 4}
  .zone-plain{fill:none;stroke:#AEB6C0;stroke-width:1.25;stroke-dasharray:4 4}
  .zone-warn{fill:#FFF6F0;stroke:#D9480F;stroke-width:1.5;stroke-dasharray:6 4}
  .bar{fill:#B9C0FF}
  .bar-accent{fill:#4F46E5}
  .bar-muted{fill:#D5D9DE}
  .bar-good{fill:#2F9E44}
  .bar-warn{fill:#D9480F}
  .edge{fill:none;stroke:#7D8794;stroke-width:1.5}
  .edge-accent{fill:none;stroke:#4F46E5;stroke-width:2}
  .edge-good{fill:none;stroke:#2F9E44;stroke-width:2}
  .edge-warn{fill:none;stroke:#D9480F;stroke-width:2}
  .dashed{stroke-dasharray:5 4}
  .rule{fill:none;stroke:#E4E1DA;stroke-width:1}
  .head{fill:#7D8794}
  .head-accent{fill:#4F46E5}
  .head-good{fill:#2F9E44}
  .head-warn{fill:#D9480F}
  text{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;fill:#1F2328;font-size:13px}
  .title{font-size:17px;font-weight:650}
  .subtitle{font-size:13px;fill:#5B6470}
  .label{font-size:13px;font-weight:600}
  .small{font-size:11.5px;fill:#5B6470}
  .tiny{font-size:10.5px;fill:#5B6470}
  .mono{font-family:Consolas,"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;font-size:12px}
  .t-accent{fill:#4F46E5}
  .t-good{fill:#2F9E44}
  .t-warn{fill:#D9480F}
  .t-muted{fill:#5B6470}
  .t-inv{fill:#FFFFFF}
  .chip{fill:#4F46E5}
  .chip-warn{fill:#D9480F}
  .chip-good{fill:#2F9E44}
  .chip-muted{fill:#5B6470}
  @media (prefers-color-scheme:dark){
    .bg{fill:#15171C}
    .frame{stroke:#2A2E36}
    .node{fill:#1D2027;stroke:#3A414C}
    .node-soft{fill:#22262E}
    .node-accent{fill:#23264A;stroke:#8E8CFF}
    .node-good{fill:#183224;stroke:#5FD07A}
    .node-warn{fill:#3A2116;stroke:#FF8A4C}
    .zone{fill:#1A1C33;stroke:#8E8CFF}
    .zone-plain{stroke:#58606C}
    .zone-warn{fill:#2A1A13;stroke:#FF8A4C}
    .bar{fill:#4B4F9E}
    .bar-accent{fill:#8E8CFF}
    .bar-muted{fill:#3A414C}
    .bar-good{fill:#5FD07A}
    .bar-warn{fill:#FF8A4C}
    .edge{stroke:#8892A0}
    .edge-accent{stroke:#8E8CFF}
    .edge-good{stroke:#5FD07A}
    .edge-warn{stroke:#FF8A4C}
    .rule{stroke:#2A2E36}
    .head{fill:#8892A0}
    .head-accent{fill:#8E8CFF}
    .head-good{fill:#5FD07A}
    .head-warn{fill:#FF8A4C}
    text{fill:#E6E8EB}
    .subtitle,.small,.tiny,.t-muted{fill:#9AA4AF}
    .t-accent{fill:#A5A3FF}
    .t-good{fill:#5FD07A}
    .t-warn{fill:#FF8A4C}
    .t-inv{fill:#15171C}
    .chip{fill:#8E8CFF}
    .chip-warn{fill:#FF8A4C}
    .chip-good{fill:#5FD07A}
    .chip-muted{fill:#9AA4AF}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="512" rx="16"/>

<text class="title" x="32" y="40">Every acceptance criterion should map to a line of the checker</text>
<text class="subtitle" x="32" y="62">All four have a line. One line is too weak, and the constraints have none.</text>

<!-- ============ the spec ============ -->
<rect class="node" x="32" y="84" width="360" height="404" rx="10"/>
<text class="tiny" x="48" y="106" letter-spacing="1.5" font-weight="700">SPEC</text>

<rect class="node-soft" x="44" y="116" width="336" height="56" rx="8"/>
<text class="tiny" x="56" y="136" letter-spacing="1.5" font-weight="700">GOAL</text>
<text class="mono" x="56" y="158">normalise_ticket(raw: str) -&gt; dict</text>

<rect class="node-accent" x="44" y="184" width="336" height="196" rx="8"/>
<text class="tiny t-accent" x="56" y="204" letter-spacing="1.5" font-weight="700">ACCEPTANCE CRITERIA</text>
<text x="56" y="236">exactly the keys: id, summary, urgency</text>
<text x="56" y="270">id matches TKT-&lt;digits&gt;, or is None</text>
<text x="56" y="304">urgency is one of: low, normal, high</text>
<text x="56" y="338">never raises</text>
<text class="small" x="56" y="358">malformed input → urgency 'normal', empty summary</text>

<rect class="node-soft" x="44" y="392" width="336" height="84" rx="8"/>
<text class="tiny" x="56" y="412" letter-spacing="1.5" font-weight="700">CONSTRAINTS</text>
<text class="small" x="56" y="434">Standard library only</text>
<text class="small" x="56" y="452">No network calls</text>
<text class="small" x="56" y="470">Under 30 lines</text>

<!-- ============ the checker ============ -->
<rect class="node" x="488" y="84" width="440" height="276" rx="10"/>
<text class="tiny" x="504" y="106" letter-spacing="1.5" font-weight="700">THE FIRST CHECKER</text>
<text class="mono t-muted" x="912" y="106" text-anchor="end">check()</text>
<text class="small" x="504" y="128">the same four cases, each run through every line:</text>
<text class="mono t-muted" x="504" y="150">"TKT-4471: VPN is down, urgent"</text>
<text class="mono t-muted" x="504" y="168">"printer jam, whenever you get a chance"</text>
<text class="mono t-muted" x="504" y="186">"TKT-12: need this today"</text>
<text class="mono t-muted" x="504" y="204">""</text>
<line class="rule" x1="504" y1="216" x2="912" y2="216"/>

<text class="mono" x="504" y="236">if set(got) != {"id", "summary", "urgency"}</text>
<text class="mono" x="504" y="270">if got.get("id") != expect["id"]</text>
<text class="mono t-warn" x="504" y="304">if got.get("urgency") not in {"low","normal","high"}</text>
<text class="mono" x="504" y="338">try: got = fn(raw)  except Exception</text>

<!-- criterion → line -->
<line class="edge-accent" x1="380" y1="232" x2="496" y2="232" marker-end="url(#arrow-accent)"/>
<line class="edge-accent" x1="380" y1="266" x2="496" y2="266" marker-end="url(#arrow-accent)"/>
<line class="edge-warn dashed" x1="380" y1="300" x2="496" y2="300" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="434" y="292" text-anchor="middle" font-weight="700">membership,</text>
<text class="tiny t-warn" x="434" y="318" text-anchor="middle" font-weight="700">not the value</text>
<line class="edge-accent" x1="380" y1="334" x2="496" y2="334" marker-end="url(#arrow-accent)"/>

<!-- untested -->
<rect class="zone-plain" x="488" y="404" width="440" height="72" rx="10"/>
<text class="label t-muted" x="504" y="430">No line checks these</text>
<text class="small" x="504" y="450">the three constraints, and the empty summary on malformed</text>
<text class="small" x="504" y="466">input, in this checker or the strict one</text>
<line class="edge dashed" x1="380" y1="440" x2="484" y2="440" marker-end="url(#arrow)"/>
<path class="edge dashed" d="M 380 354 L 400 354 L 400 440"/>
</svg>
