<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="632" rx="16"/>

<text class="title" x="32" y="40">The cheat passes the lenient checker and fails the strict one</text>
<text class="subtitle" x="32" y="62">A real implementation passes both, so the hardening tests the right thing, not just more things.</text>

<!-- ============ the implementations ============ -->
<text class="tiny" x="32" y="140" letter-spacing="1.5" font-weight="700">SAME FOUR CASES</text>
<text class="small" x="32" y="162">two implementations,</text>
<text class="small" x="32" y="180">each run through two checkers</text>

<rect class="node-warn" x="376" y="84" width="264" height="124" rx="10"/>
<text class="tiny t-warn" x="392" y="106" letter-spacing="1.5" font-weight="700">THE CHEAT</text>
<text class="small" x="392" y="126">ignores the ticket text</text>
<text class="mono" x="392" y="152">'summary': ''</text>
<text class="mono" x="392" y="172">'urgency': 'normal'</text>
<text class="small" x="392" y="194">for every ticket</text>

<rect class="node" x="664" y="84" width="264" height="124" rx="10"/>
<text class="tiny" x="680" y="106" letter-spacing="1.5" font-weight="700">A REAL IMPLEMENTATION</text>
<text class="small" x="680" y="126">reads the text</text>
<text class="mono" x="680" y="152">'urgent'   → 'high'</text>
<text class="mono" x="680" y="172">'whenever' → 'low'</text>
<text class="mono" x="680" y="194">'summary': raw[:40]</text>


<!-- ============ row 1: lenient ============ -->
<rect class="node" x="32" y="232" width="320" height="76" rx="10"/>
<text class="mono" x="48" y="256">check</text>
<text class="tiny t-muted" x="336" y="256" text-anchor="end" letter-spacing="1" font-weight="700">LENIENT</text>
<text class="small" x="48" y="276">urgency is one of low, normal, high</text>
<text class="small" x="48" y="294">summary: nothing asserted</text>

<rect class="node-warn" x="376" y="232" width="264" height="76" rx="10"/>
<text class="label t-warn" x="508" y="264" text-anchor="middle">passed</text>
<text class="small" x="508" y="286" text-anchor="middle">the loop would stop and ship it</text>

<rect class="node-good" x="664" y="232" width="264" height="76" rx="10"/>
<text class="label t-good" x="796" y="264" text-anchor="middle">passed</text>
<text class="small" x="796" y="286" text-anchor="middle">correct</text>


<!-- ============ row 2: strict ============ -->
<rect class="node-accent" x="32" y="324" width="320" height="76" rx="10"/>
<text class="mono t-accent" x="48" y="348">check_strict</text>
<text class="tiny t-accent" x="336" y="348" text-anchor="end" letter-spacing="1" font-weight="700">STRICT</text>
<text class="small" x="48" y="368">urgency equals the expected value</text>
<text class="small" x="48" y="386">summary non-empty when the input is</text>

<rect class="node-good" x="376" y="324" width="264" height="76" rx="10"/>
<text class="label t-good" x="508" y="356" text-anchor="middle">5 failures</text>
<text class="small" x="508" y="378" text-anchor="middle">caught</text>

<rect class="node-good" x="664" y="324" width="264" height="76" rx="10"/>
<text class="label t-good" x="796" y="356" text-anchor="middle">passed</text>
<text class="small" x="796" y="378" text-anchor="middle">still correct</text>

<text class="tiny t-muted" x="376" y="420">Green: the verdict you want. Orange: a pass you must not trust.</text>

<!-- ============ the five failures ============ -->
<rect class="node" x="32" y="440" width="896" height="168" rx="10"/>
<text class="tiny" x="48" y="462" letter-spacing="1.5" font-weight="700">THE CHEAT UNDER CHECK_STRICT, CASE BY CASE</text>
<text class="tiny" x="456" y="484" letter-spacing="1" font-weight="700" text-anchor="middle">EXPECTED</text>
<text class="tiny" x="576" y="484" letter-spacing="1" font-weight="700" text-anchor="middle">CHEAT GIVES</text>
<text class="tiny" x="680" y="484" letter-spacing="1" font-weight="700">FAILURES</text>
<line class="rule" x1="48" y1="492" x2="912" y2="492"/>

<text class="mono" x="48" y="516">"TKT-4471: VPN is down, urgent"</text>
<text x="456" y="516" text-anchor="middle">high</text>
<text class="t-muted" x="576" y="516" text-anchor="middle">normal</text>
<text class="t-warn" x="680" y="516" font-weight="600">urgency, empty summary</text>

<text class="mono" x="48" y="540">"printer jam, whenever you get a chance"</text>
<text x="456" y="540" text-anchor="middle">low</text>
<text class="t-muted" x="576" y="540" text-anchor="middle">normal</text>
<text class="t-warn" x="680" y="540" font-weight="600">urgency, empty summary</text>

<text class="mono" x="48" y="564">"TKT-12: need this today"</text>
<text x="456" y="564" text-anchor="middle">normal</text>
<text class="t-muted" x="576" y="564" text-anchor="middle">normal</text>
<text class="t-warn" x="680" y="564" font-weight="600">empty summary</text>

<text class="mono" x="48" y="588">""</text>
<text x="456" y="588" text-anchor="middle">normal</text>
<text class="t-muted" x="576" y="588" text-anchor="middle">normal</text>
<text class="t-good" x="680" y="588" font-weight="600">none</text>
</svg>
