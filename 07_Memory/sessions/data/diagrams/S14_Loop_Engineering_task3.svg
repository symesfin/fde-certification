<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-good" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-warn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="960" height="520" rx="16"/>

<text class="title" x="32" y="40">The loop stops one of three ways, and says which</text>
<text class="subtitle" x="32" y="62">Every attempt starts fresh. Only the notes file carries anything from one iteration to the next.</text>

<!-- ============ top row ============ -->
<rect class="node" x="32" y="96" width="144" height="56" rx="10"/>
<text class="mono" x="104" y="120" text-anchor="middle">read_notes()</text>
<text class="small" x="104" y="139" text-anchor="middle">from /AGENTS.md</text>

<line class="edge" x1="176" y1="124" x2="196" y2="124" marker-end="url(#arrow)"/>
<rect class="node-accent" x="200" y="96" width="208" height="56" rx="10"/>
<text class="mono t-accent" x="304" y="120" text-anchor="middle">attempt_fn(spec, notes)</text>
<text class="small" x="304" y="139" text-anchor="middle">returns code</text>

<line class="edge" x1="408" y1="124" x2="428" y2="124" marker-end="url(#arrow)"/>
<rect class="node" x="432" y="96" width="136" height="56" rx="10"/>
<text class="mono" x="500" y="120" text-anchor="middle">exec(code)</text>
<text class="small" x="500" y="139" text-anchor="middle">compile and run</text>

<line class="edge" x1="568" y1="124" x2="588" y2="124" marker-end="url(#arrow)"/>
<rect class="node" x="592" y="96" width="136" height="56" rx="10"/>
<text class="mono" x="660" y="120" text-anchor="middle">checker()</text>
<text class="small" x="660" y="139" text-anchor="middle">check_strict</text>

<line class="edge" x1="728" y1="124" x2="748" y2="124" marker-end="url(#arrow)"/>
<rect class="node-soft" x="752" y="104" width="80" height="40" rx="20"/>
<text class="label" x="792" y="129" text-anchor="middle">passed?</text>

<line class="edge-good" x1="832" y1="124" x2="852" y2="124" marker-end="url(#arrow-good)"/>
<text class="tiny t-good" x="842" y="114" text-anchor="middle" font-weight="700">yes</text>
<rect class="chip-good" x="856" y="112" width="72" height="24" rx="12"/>
<text class="small t-inv" x="892" y="128" text-anchor="middle" font-weight="600">passed</text>

<!-- ============ bottom row, right to left ============ -->
<line class="edge" x1="792" y1="144" x2="792" y2="292" marker-end="url(#arrow)"/>
<text class="tiny" x="800" y="172" font-weight="700">no</text>

<rect class="node" x="616" y="296" width="208" height="56" rx="10"/>
<text class="label" x="720" y="320" text-anchor="middle">append a note</text>
<text class="mono t-muted" x="720" y="340" text-anchor="middle">"; ".join(failures[:3])</text>

<line class="edge" x1="616" y1="324" x2="572" y2="324" marker-end="url(#arrow)"/>
<rect class="node-soft" x="384" y="296" width="184" height="56" rx="28"/>
<text class="label" x="476" y="320" text-anchor="middle">same note twice?</text>
<text class="small" x="476" y="339" text-anchor="middle">learned in this run</text>

<line class="edge" x1="384" y1="324" x2="340" y2="324" marker-end="url(#arrow)"/>
<text class="tiny" x="362" y="314" text-anchor="middle" font-weight="700">no</text>
<rect class="node-soft" x="152" y="296" width="184" height="56" rx="28"/>
<text class="label" x="244" y="320" text-anchor="middle">iterations left?</text>
<text class="mono t-muted" x="244" y="340" text-anchor="middle">max_iterations=5</text>

<!-- go round again -->
<path class="edge" d="M 152 324 L 64 324 L 64 156" marker-end="url(#arrow)"/>
<text class="tiny" x="72" y="300" font-weight="700">yes, again</text>

<!-- the two stops -->
<line class="edge-warn" x1="476" y1="352" x2="476" y2="380" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="484" y="372" font-weight="700">yes</text>
<rect class="chip-warn" x="364" y="384" width="224" height="24" rx="12"/>
<text class="small t-inv" x="476" y="400" text-anchor="middle" font-weight="600">no progress between attempts</text>

<line class="edge-warn" x1="244" y1="352" x2="244" y2="380" marker-end="url(#arrow-warn)"/>
<text class="tiny t-warn" x="252" y="372" font-weight="700">no</text>
<rect class="chip-warn" x="164" y="384" width="160" height="24" rx="12"/>
<text class="small t-inv" x="244" y="400" text-anchor="middle" font-weight="600">budget exhausted</text>

<!-- ============ the store ============ -->
<rect class="zone" x="216" y="184" width="352" height="80" rx="14"/>
<text class="tiny t-accent" x="232" y="204" letter-spacing="1.5" font-weight="700">THE STORE, OUTLIVES THE RUN</text>
<text class="mono t-muted" x="232" y="226">("loop-notes", "916ea3df9fbd")</text>
<rect class="node-accent" x="232" y="234" width="104" height="22" rx="6"/>
<text class="mono t-accent" x="284" y="250" text-anchor="middle">/AGENTS.md</text>
<text class="small" x="348" y="250">one "- " line per note</text>

<!-- writes and reads -->
<path class="edge-accent" d="M 680 296 L 680 224 L 572 224" marker-end="url(#arrow-accent)"/>
<text class="tiny t-accent" x="688" y="256" font-weight="700">write_notes</text>
<path class="edge-accent" d="M 216 224 L 136 224 L 136 156" marker-end="url(#arrow-accent)"/>
<text class="tiny t-accent" x="144" y="216" font-weight="700">reads</text>

<!-- ============ tested without a model ============ -->
<line class="rule" x1="32" y1="432" x2="928" y2="432"/>
<text class="tiny" x="32" y="456" letter-spacing="1.5" font-weight="700">TESTED WITH SCRIPTED AGENTS, NO MODEL</text>
<text class="small" x="32" y="480"><tspan font-weight="600">improving agent</tspan> passed on iteration 3</text>
<text class="small" x="332" y="480"><tspan font-weight="600">stuck agent</tspan>, budget 10: stopped after 2</text>
<text class="small" x="632" y="480"><tspan font-weight="600">lazy agent</tspan> vs lenient check:</text>
<text class="small t-warn" x="632" y="498" font-weight="600">shipped the cheat on iteration 1</text>
</svg>
