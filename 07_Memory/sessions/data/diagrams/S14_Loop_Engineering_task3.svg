<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">The loop stops one of three ways, and says which</title>
<desc id="desc">Each iteration of ralph_loop reads the notes from /AGENTS.md, calls attempt_fn(spec, notes) for code, runs it with exec, and passes it to the checker. If the checker passes, the loop returns ok. Otherwise it appends a note, the first three failures joined by semicolons, to /AGENTS.md in the store under the namespace ("loop-notes", "916ea3df9fbd"). If the last two notes learned in this run are identical, it stops with "no progress between attempts". If max_iterations=5 is used up, it stops with "budget exhausted". Otherwise it goes round again. Tested with scripted agents and no model: the improving agent passed on iteration 3, the stuck agent stopped after 2 of its 10 iterations, and the lazy agent shipped the cheat on iteration 1 against the lenient checker.</desc>
<style>
